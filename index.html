<style>
  /* COLORS */
  :root { --gold: #a39068; --gold-light: #c4b490; --ink: #333536; --ink-deep: #2a2c2d; --cream: #f0ece6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 48px 24px;
    background: radial-gradient(120% 90% at 50% 0%, #3d4041 0%, var(--ink) 45%, var(--ink-deep) 100%); color: var(--cream);
    font: 16px/1.5 "avenir-next-lt-pro", "Avenir Next", Avenir, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { width: 100%; max-width: 560px; text-align: center; }
  .logo { display: block; width: min(300px, 70vw); height: auto; margin: 0 auto; fill: var(--cream); }
  .rule { width: 56px; height: 1px; background: var(--gold); margin: 38px auto 38px; border: 0; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 76px; padding: 16px 18px;
    border: 1px solid var(--gold); color: var(--cream); text-decoration: none; transition: background .2s, color .2s, border-color .2s; }
  .btn b { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .btn span { font-family: "freight-neo-pro", Georgia, serif; font-size: 15px; color: var(--gold-light); transition: color .2s; }
  .btn.main { background: var(--gold); color: var(--ink-deep); }
  .btn.main span { color: var(--ink-deep); }
  .btn:hover, .btn:focus-visible { background: var(--cream); border-color: var(--cream); color: var(--ink-deep); }
  .btn:hover span, .btn:focus-visible span { color: var(--ink); }
  .btn:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }
  @media (max-width: 520px) { .links { grid-template-columns: 1fr; } .rule { margin: 26px auto 28px; } }
  @media (prefers-reduced-motion: reduce) { .btn, .btn span { transition: none; } }
</style>
